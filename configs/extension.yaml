# Browser inspection over the existing FEVER-derived DEBUG corpus.
# This corpus is small and gold-containing by construction, not open-domain truth.
# BM25 Quick Check works without transformer downloads. Full Inspection uses NLI.
harness:
  kind: debug
  corpus_note: "FEVER-derived debug corpus; limited coverage, not a scientific evaluation"
seed: 1337
pipeline:
  k: 5
paths:
  corpus: data/debug/corpus.jsonl
  examples: data/debug/examples.jsonl
  index_dir: data/debug/index
  results_dir: results
  failure_cases: results/failure_cases
components:
  extractor: spacy_sentence
  retriever:
    name: bm25
    params:
      corpus_path: data/debug/corpus.jsonl
  reranker: noop
  verifier: nli_deberta
  aggregator:
    name: threshold_abstain
    params:
      support_floor: 0.5
      contradict_floor: 0.5
      abstain_below: 0.4
